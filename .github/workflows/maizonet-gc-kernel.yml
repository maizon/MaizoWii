name: MaizoNet GC - compile Nintendont kernel (experimental)
on:
  push:
    branches:
      - work/maizonet-smb1-direct
      - work/maizonet-nintendont-direct
    paths:
      - integrations/maizonet_*
      - tools/patch_nintendont_maizonet.py
      - tools/test_maizonet_smb1.py
      - tests/smb1_wire.c
      - tests/smb1_browse.c
      - tests/smb1_live.c
      - source/launch.c
      - docs/MAIZONET_EXPERIMENTAL.md
      - .github/workflows/maizonet-gc-kernel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-smb1-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify SMB1 protocol and patch script on native Linux
        run: |
          set -eu
          python3 tools/test_maizonet_smb1.py
          python3 tools/test_maizonet_udp.py
          python3 -m py_compile tools/patch_nintendont_maizonet.py
  test-smb1-samba:
    needs: test-smb1-host
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify real Samba SMB1 guest listing and ISO random read
        run: |
          set -eu
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq samba
          ROOT="$(mktemp -d)"
          mkdir -p "$ROOT/share/Games" "$ROOT/state"
          python3 - "$ROOT/share/Games/game.iso" <<'PY'
          import sys
          with open(sys.argv[1], 'wb') as fp:
              fp.write(bytes(0x20000))
              fp.write(b'MZTESTSECTOR' + bytes(256))
          PY
          chmod 755 "$ROOT"
          chmod -R a+rX "$ROOT/share"
          cat > "$ROOT/smb.conf" <<INI
          [global]
            server role = standalone server
            security = user
            map to guest = Bad User
            guest account = nobody
            server min protocol = NT1
            server max protocol = NT1
            smb ports = 1445
            interfaces = 127.0.0.1
            bind interfaces only = yes
            log file = $ROOT/state/samba.log
            lock directory = $ROOT/state
            state directory = $ROOT/state
            cache directory = $ROOT/state
            pid directory = $ROOT/state
            private dir = $ROOT/state
            load printers = no
            disable spoolss = yes
          [PS2]
            path = $ROOT/share
            browseable = yes
            guest ok = yes
            read only = yes
          INI
          sudo systemctl stop smbd nmbd || true
          sudo smbd -F -s "$ROOT/smb.conf" -l "$ROOT/state" &
          sleep 2
          sudo ss -lntp | grep 1445 || true
          cc -std=c99 -O2 -Wall -Wextra -Werror \
             -I integrations integrations/maizonet_smb1.c tests/smb1_live.c \
             -o "$ROOT/smb1-live"
          "$ROOT/smb1-live" MZTESTSECTOR || {
            cat "$ROOT/state/samba.log" || true
            exit 1
          }
  build-nintendont:
    needs: [test-smb1-host, test-smb1-samba]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: devkitpro/devkitppc:20210619
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned legacy ARM/PPC compiler availability
        run: |
          set -eu
          echo "ARM="; command -v arm-none-eabi-gcc || true
          echo "PPC="; command -v powerpc-eabi-gcc || true
          test -x /opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc
          # This official historical image supplies the old libogc ABI that
          # Nintendont requires. Do NOT upgrade to latest toolchain in CI.
          test -x /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc
          /opt/devkitpro/devkitARM/bin/arm-none-eabi-gcc --version | head -1
          /opt/devkitpro/devkitPPC/bin/powerpc-eabi-gcc --version | head -1
      - name: Fetch pinned upstream Nintendont
        run: |
          set -eu
          git clone --quiet https://github.com/FIX94/Nintendont.git upstream-nintendont
          git -C upstream-nintendont checkout --detach c683db301c941a64e6fe5cef6ac079bd1a726074
      - name: Apply MaizoNet kernel adapter when available
        run: |
          if test -f tools/patch_nintendont_maizonet.py; then
            python3 tools/patch_nintendont_maizonet.py upstream-nintendont
          else
            echo "No kernel patch yet: baseline upstream build only"
          fi
      - name: Compile Nintendont kernel and loader (not a Wii gameplay test)
        env:
          DEVKITPRO: /opt/devkitpro
          DEVKITPPC: /opt/devkitpro/devkitPPC
          DEVKITARM: /opt/devkitpro/devkitARM
        run: |
          set -e
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global --add safe.directory "$GITHUB_WORKSPACE/upstream-nintendont"
          make -C upstream-nintendont -j2
          test -s upstream-nintendont/kernel/kernel.bin
          test -s upstream-nintendont/loader/loader.dol
          grep -Fq 'if(mznet_iso)' upstream-nintendont/kernel/ISO.c
          grep -Fq 'MaizoNetSelectGame' upstream-nintendont/loader/source/menu.c
          grep -Fq 'maizonet_smb1_list_dir' upstream-nintendont/loader/source/maizonet_smb1.c
          grep -Fq 'MAIZONET ARM ERROR: CODE=' upstream-nintendont/loader/source/main.c
          grep -Fq 'MZ_TCP_TIMEOUT_TICKS' upstream-nintendont/kernel/maizonet_nintendont_net.c
          grep -Fq 'mz_record(148' upstream-nintendont/kernel/maizonet_nintendont_net.c
          grep -Fq 'mz_record(149' upstream-nintendont/kernel/maizonet_nintendont_net.c
          grep -Fq 'last_reason=7' upstream-nintendont/kernel/maizonet_smb1.c
          grep -Fq 'phase=%u reason=%u' upstream-nintendont/kernel/maizonet_nintendont_net.c
          find upstream-nintendont -type f \( -name loader.dol -o -name kernel.bin \) -print -exec ls -lh {} \;
      - name: Stage distinct experimental Nintendont (do not replace stock)
        run: |
          set -eu
          test -s upstream-nintendont/loader/loader.dol
          mkdir -p maizonet-stage/apps/nintendont-maizonet maizonet-stage/maizo
          cp upstream-nintendont/loader/loader.dol maizonet-stage/apps/nintendont-maizonet/boot.dol
          cp docs/MAIZONET_EXPERIMENTAL.md maizonet-stage/LEIA-MAIZONET.md
          mkdir -p maizonet-stage/maizo/maizonet
          cp tools/maizonet_udp_server.py maizonet-stage/maizo/maizonet/servidor-android.py
          cat > maizonet-stage/maizo/network.ini.udp.example <<'INI'
          # Keep the existing Samba server at TCP 1445 for the 128KiB header
          host=192.168.0.2
          port=1445
          share=PS2
          path=Gamecube/games/XIII/game.iso
          # During gameplay the custom Nintendont ARM streams through UDP.
          protocol=udp
          udp_port=17445
          INI
          cat > maizonet-stage/apps/nintendont-maizonet/meta.xml <<'XML'
          <?xml version="1.0" encoding="UTF-8"?>
          <app version="1">
            <name>Nintendont MaizoNet (experimental)</name>
            <coder>FIX94 / MaizoNet integration</coder>
            <version>0.0.1-experimental</version>
            <short_description>Independent SMB browser and virtual disc - unverified Wii</short_description>
            <ahb_access/>
          </app>
          XML
          cat > maizonet-stage/maizo/network.ini.example <<'INI'
          host=192.168.1.100
          port=1445
          share=PS2
          path=GameCube/Meu Jogo/game.iso
          INI
      - name: Upload experimental bundle (NOT a proven gameplay release)
        uses: actions/upload-artifact@v4
        with:
          name: MAIZONET-NINTENDONT-EXPERIMENTAL
          path: maizonet-stage/
          if-no-files-found: error
          retention-days: 7

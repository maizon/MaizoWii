name: MAIZO Wii - build and bundle
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_rebuild:
        description: Recompile even when cached
        type: boolean
        default: false

concurrency:
  group: maizo-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20261102
    steps:
      - uses: actions/checkout@v4
      - name: Validate frontend contracts and packaging logic
        run: |
          python3 tools/test_contract.py
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 -m unittest discover -s tests -p "test_*.py"
          python3 tools/test_premium_ui.py
          python3 -m py_compile tools/package_all.py
      # Independent cache keys: changing the frontend does not compile the forwarder,
      # and changing the forwarder does not compile the frontend.
      - name: Restore frontend DOL (only frontend dependencies)
        id: cached-frontend
        uses: actions/cache@v4
        with:
          path: boot.dol
          key: maizo-frontend-v2-${{ hashFiles('source/**', 'include/**', 'Makefile', 'bootstub/**', 'tools/embed_bootstub.py', 'assets/**', 'data/**') }}-devkitppc-20261102-${{ inputs.full_rebuild && github.run_id || 'regular' }}
      - name: Install pinned HTTPS client for native Wii cover downloads
        if: steps.cached-frontend.outputs.cache-hit != 'true'
        run: |
          set -eu
          mkdir -p /tmp/maizo-cover-libs
          cd /tmp/maizo-cover-libs
          REL='https://github.com/AndrewPiroli/wii-curl/releases/download/c8.12.1%2Bm3.6.2'
          for archive in wii-curl-8.12.1-1-any.pkg.tar.gz libwiisocket-0.1-1-any.pkg.tar.gz wii-mbedtls-3.6.2-2-any.pkg.tar.gz; do
            curl --fail --location --retry 3 --output "$archive" "$REL/$archive"
            tar -xzf "$archive"
          done
          cp -a opt/devkitpro/. /opt/devkitpro/
          # libpng is a PowerPC portlib, NOT included in every devkitPPC image.
          if [ ! -f /opt/devkitpro/portlibs/ppc/include/png.h ]; then
            dkp-pacman -Sy --needed --noconfirm ppc-libpng
          fi
          echo "HTTPS/PNG DEPENDENCIES (for easier CI diagnosis):"
          find /opt/devkitpro -name libcurl.a -o -name libwiisocket.a -o -name libpng.a -o -name png.h -o -name wiisocket.h
          tar -tzf libwiisocket-0.1-1-any.pkg.tar.gz | grep -E '/(lib|include)/|libwiisocket' | tail -25
          test -s /opt/devkitpro/portlibs/wii/lib/libcurl.a
          test -e /opt/devkitpro/portlibs/wii/include/curl/curl.h
          test -e /opt/devkitpro/portlibs/ppc/include/libpng16/png.h
      - name: Compile frontend on cache miss only
        if: steps.cached-frontend.outputs.cache-hit != 'true'
        run: make -j2
      - name: Restore forwarder DOL (only forwarder dependencies)
        id: cached-forwarder
        uses: actions/cache@v4
        with:
          path: forwarder/boot.dol
          key: maizo-forwarder-v4-osc-${{ hashFiles('forwarder/main.c', 'forwarder/Makefile', 'forwarder/data/**', 'tools/embed_osc_booter.py') }}-devkitppc-20261102-${{ inputs.full_rebuild && github.run_id || 'regular' }}
      - name: Compile forwarder on cache miss only
        if: steps.cached-forwarder.outputs.cache-hit != 'true'
        run: make -C forwarder -j2
      - name: Verify OSC/FIX94 forwarder selected (not old MEM2 bootstub)
        run: |
          strings forwarder/boot.dol | grep -F 'MAIZO FIX94-COMPAT FORWARDER v6'
          python3 tools/test_osc_forwarder.py
      - name: Stage frontend
        run: |
          test -s boot.dol
          mkdir -p stage/apps/maizo
          cp boot.dol apps/maizo/meta.xml stage/apps/maizo/
          test -s forwarder/boot.dol
          mkdir -p stage/apps/maizo-forwarder
          cp forwarder/boot.dol forwarder/meta.xml stage/apps/maizo-forwarder/
      - uses: actions/upload-artifact@v4
        with:
          name: MAIZOWII-FRONTEND
          path: stage/
          retention-days: 14

  installer-hid:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitppc:20261102
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Restore YAWM result (success or known source-build failure)
        id: cached
        uses: actions/cache@v4
        with:
          path: |
            upstream-yawm/boot.dol
            upstream-yawm/.maizo-build-result
          key: maizo-yawm-v2-62205f9ab507cdceae94c77197b1b459f0276d39-${{ hashFiles('tools/patch_yawm.py', 'integrations/maizo_hid.inc', 'integrations/maizo_report.h', 'integrations/maizo_multi.h', 'integrations/yawm_*') }}-devkitppc-20261102-${{ inputs.full_rebuild && github.run_id || 'regular' }}
      - name: Fetch pinned YAWM ModMii Edition source
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git clone --depth 1 https://github.com/modmii/YAWM-ModMii-Edition.git upstream-yawm
          cd upstream-yawm
          git fetch --depth 1 origin 62205f9ab507cdceae94c77197b1b459f0276d39
          git checkout --detach 62205f9ab507cdceae94c77197b1b459f0276d39
          git config --global --add safe.directory "$PWD"
      - name: Apply shared HID to YAWM without bypassing NAND confirmation
        if: steps.cached.outputs.cache-hit != 'true'
        run: python3 tools/patch_yawm.py upstream-yawm
      - name: Compile adapted YAWM DOL
        if: steps.cached.outputs.cache-hit != 'true'
        id: compilation
        continue-on-error: true
        run: make -C upstream-yawm -j2
      - name: Diagnose YAWM small-data link failure (no false success)
        if: steps.cached.outputs.cache-hit != 'true' && steps.compilation.outcome != 'success'
        run: |
          echo "YAWM source build failed; checking actual PPC linker map."
          MAP=upstream-yawm/build/boot.elf.map
          if [ -f "$MAP" ]; then
            grep -n -E '^\\.(sdata|sbss)|_SDA_BASE_|__ppc_(excpt_sp|main_sp)|__system_argv|\\.sdata\\.hId' "$MAP" | head -65 || true
            ls -lh "$MAP"
          else
            echo "No linker map generated."
          fi
      - name: Record YAWM result for unchanged source
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          if [ "${{ steps.compilation.outcome }}" = "success" ] && test -s upstream-yawm/boot.dol; then
            echo success > upstream-yawm/.maizo-build-result
          else
            rm -f upstream-yawm/boot.dol
            echo fallback > upstream-yawm/.maizo-build-result
          fi
      - name: Validate cached or freshly built YAWM decision
        id: result
        run: |
          test -s upstream-yawm/.maizo-build-result
          if grep -qx success upstream-yawm/.maizo-build-result; then
            test -s upstream-yawm/boot.dol
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            grep -qx fallback upstream-yawm/.maizo-build-result
            echo 'publish=false' >> "$GITHUB_OUTPUT"
            echo 'YAWM HID was not compiled; official fallback will be used.'
          fi
      - name: Package HID-enabled YAWM only after compilation or verified cache hit
        if: steps.result.outputs.publish == 'true'
        run: |
          mkdir -p patched/apps/maizo-installer
          cp upstream-yawm/boot.dol patched/apps/maizo-installer/boot.dol
      - uses: actions/upload-artifact@v4
        if: steps.result.outputs.publish == 'true'
        with:
          name: MAIZO-ADAPTED-installer
          path: patched/
          retention-days: 14

  launch-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and execute the production argv builder on host GCC
        run: python3 -m unittest discover -s tools -p 'test_launch_args.py' -v

  adapted:
    uses: ./.github/workflows/build-adapted-modules.yml
    with:
      full_rebuild: ${{ inputs.full_rebuild || false }}

  wiimc-dolphin-smoke:
    # Compare the adapted DOL with a PREBUILT upstream original. Do not waste
    # time recompiling a control. A black root screenshot proves nothing
    # unless the baseline renders in the identical emulator environment.
    needs: [adapted, all-in-one]
    runs-on: ubuntu-26.04
    timeout-minutes: 12
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MAIZO-ADAPTED-WiiMC
          path: wiimc
      - uses: actions/download-artifact@v4
        with:
          name: MAIZOWII-PREVIEW-USB-SD
          path: official-archive
      - name: Extract unmodified official WiiMC baseline without compilation
        run: |
          unzip -q official-archive/MAIZOWII-ALL-IN-ONE.zip 'apps/WiiMC-official/boot.dol' -d official
          test -s official/apps/WiiMC-official/boot.dol
          test -s wiimc/apps/WiiMC/boot.dol
      - name: Install Dolphin and virtual display
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq dolphin-emu xvfb imagemagick python3-pil x11-utils
      - name: Compare WiiMC original and HID in the SAME Dolphin environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p smoke
          xvfb-run -a -s "-screen 0 1280x800x24" bash -c '
            export LIBGL_ALWAYS_SOFTWARE=1 QT_X11_NO_MITSHM=1 QT_QPA_PLATFORM=xcb
            for name in official adapted; do
              if test "$name" = official; then dol="$PWD/official/apps/WiiMC-official/boot.dol"; else dol="$PWD/wiimc/apps/WiiMC/boot.dol"; fi
              timeout 34s dolphin-emu --video_backend="Software Renderer" --user="$PWD/smoke/user-$name" --exec="$dol" > "smoke/$name.log" 2>&1 &
              job=$!
              sleep 20
              ps ax -o pid,stat,comm,args | grep -i dolphin > "smoke/$name-process.txt" || true
              xwininfo -root -tree > "smoke/$name-windows.txt" 2>&1 || true
              import -display "$DISPLAY" -window root "smoke/$name.png" || true
              kill "$job" 2>/dev/null || true
              wait "$job" 2>/dev/null || true
              sleep 1
            done
          '
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          results={}
          for name in ("official","adapted"):
              p=Path(f"smoke/{name}.png")
              if not p.is_file():
                  results[name]=-1
                  continue
              im=Image.open(p).convert("RGB")
              w,h=im.size
              sample=im.crop((w//4,h//4,3*w//4,3*h//4)).resize((128,128))
              results[name]=sum(1 for r,g,b in sample.getdata() if max(r,g,b)>32)
          verdict=f"Dolphin center bright pixels original={results['official']} adapted={results['adapted']} (16384 max each)"
          Path("smoke/verdict.txt").write_text(verdict+"\\n")
          print(verdict)
          if results["official"]<100:
              raise SystemExit("INCONCLUSIVE: official WiiMC also rendered no usable GUI under headless Dolphin")
          if results["adapted"]<100:
              raise SystemExit("FAIL: original WiiMC rendered but HID-adapted WiiMC did not")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MAIZO-WIIMC-DOLPHIN-SMOKE
          path: smoke/
          retention-days: 14

  all-in-one:
    runs-on: ubuntu-latest
    needs: [frontend, adapted, launch-contracts, installer-hid]
    if: always() && needs.frontend.result == 'success' && needs.launch-contracts.result == 'success'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAIZOWII-FRONTEND
          path: stage/
      - name: Download successfully compiled HID modules
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: MAIZO-ADAPTED-*
          merge-multiple: true
          path: patched
      - name: Install archive extractor
        run: sudo apt-get update && sudo apt-get install -y p7zip-full
      - name: Collect pinned official homebrew modules
        run: python3 tools/package_all.py --frontend stage/apps/maizo/boot.dol --forwarder stage/apps/maizo-forwarder/boot.dol --out dist
      - name: Prepare licensed console portraits for FAT32 storage
        run: |
          python3 -m pip install --user --break-system-packages Pillow
          python3 tools/prepare_system_icons.py --out dist/maizo/covers
      - name: Overlay HID builds with fail-safe official fallback
        run: python3 tools/overlay_adapted.py patched dist
      - name: Require HID YAWM for ALL-IN-ONE release
        if: false # Preview packaging never claims installer HID compatibility
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("dist/maizo/MODULE_MANIFEST.json").read_text())
          manager=m.get("installer",{})
          assert manager.get("hid_adapted") is True, (
              "YAWM official fallback is NOT a HID installer. "
              "The required source-built HID manager failed to compile. "
              "No ALL-IN-ONE release can be published until this is fixed.")
          print("PASS: YAWM USB HID source binary included with SHA-256")
          PY
      - name: Report actual adapted vs official binaries
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          m=json.loads(Path('dist/maizo/MODULE_MANIFEST.json').read_text())
          adapted=m.get('adapted_modules',[])
          fallback=m.get('fallback_modules',[])
          report=['## Maizo Wii: build provenance',
                  '**HARDWARE TESTS STILL PENDING.**',
                  'HID adapted: '+(', '.join(adapted) or 'none'),
                  'Official fallback: '+(', '.join(fallback) or 'none')]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n\n'.join(report)+'\n')
          print('FALLBACKS:',fallback)
          PY
      # The package must include an actual channel WAD, not only a forwarder DOL.
      # It remains experimental until real-console verification.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install channel packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make zlib1g-dev fonts-dejavu-core
          python3 -m pip install --user --break-system-packages Pillow pycryptodomex
      - name: Build Maizo channel banner and icon
        run: |
          git clone -q https://github.com/Monsterray/hbc-reborn.git channel-base
          git -C channel-base checkout --detach 559a768d63a38cfe3fcd142b31c5b5c36d566f49
          python3 tools/render_wad_titles.py channel-base
          make -C channel-base/channel/banner -j2
          test -s channel-base/channel/banner/build/banner.arc
          test -s channel-base/channel/banner/build/icon.arc
      - name: Package experimental IOS58 MZIO forwarder WAD
        run: |
          git clone -q https://github.com/davi-x86/WadPakk.git wad-builder
          git -C wad-builder checkout --detach 155a00d4b2180eab968cf5b2f5da68f3c3ebdafd
          dotnet build wad-builder/WadPakk.csproj -c Release -p:PlatformTarget=AnyCPU -p:RuntimeIdentifier=linux-x64
          cp -r wad-builder/Resources wad-builder/bin/Release/net8.0/linux-x64/Resources
          dotnet wad-builder/bin/Release/net8.0/linux-x64/WadPakk.dll pack \
            -base wad-builder/Resources/base.wad \
            -banner channel-base/channel/banner/build/banner.arc \
            -icon channel-base/channel/banner/build/icon.arc \
            -dol dist/apps/maizo-forwarder/boot.dol \
            -id MZIO -name "Maizo Wii" -ios 58 -loader comex \
            -o dist/wad/MAIZOWII-FORWARDER-MZIO-EXPERIMENTAL.wad
          python3 tools/inspect_forwarder_wad.py dist/wad/MAIZOWII-FORWARDER-MZIO-EXPERIMENTAL.wad
          python3 tools/assemble_channel.py dist
      - name: Verify every executable and zip the storage root
        run: |
          test -s dist/apps/maizo-installer/boot.dol
          test -s dist/apps/maizo-forwarder/boot.dol
          python3 tools/verify_bundle.py dist
          cd dist
          zip -q -r ../MAIZOWII-ALL-IN-ONE.zip .
          cd ..
          unzip -l MAIZOWII-ALL-IN-ONE.zip | tail -12
      - uses: actions/upload-artifact@v4
        with:
          name: MAIZOWII-PREVIEW-USB-SD
          path: MAIZOWII-ALL-IN-ONE.zip
          retention-days: 14
      - name: Build a NAND-safe QA preview archive
        run: |
          set -euo pipefail
          mkdir -p safe-qa
          unzip -q MAIZOWII-ALL-IN-ONE.zip -d safe-qa
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("safe-qa")
          p=root/"maizo/MODULE_MANIFEST.json"
          manifest=json.loads(p.read_text(encoding="utf-8"))
          channel=manifest.pop("channel",None)
          if channel:
              wad=root/channel["path"]
              if not (wad.is_file() and wad.suffix.lower()==".wad"):
                  raise SystemExit("Expected WAD absent or invalid")
              wad.unlink()
          manifest["installer"]["channel_wad_included"]=False
          (root/"wad/SHA256SUMS").unlink(missing_ok=True)
          (root/"maizo/LEIA-PRIMEIRO.txt").write_text(
              "MaizoWii QA: ainda NAO e v1.0.0 estavel.\n"
              "Copie o ZIP na raiz SD/USB e abra apps/maizo/boot.dol no HBC.\n"
              "Nao instale WAD experimental na NAND.\n",encoding="utf-8")
          (root/"wad/LEIA-ANTES-DE-INSTALAR.txt").write_text(
              "Canal WAD experimental omitido por seguranca.\n",encoding="utf-8")
          p.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          python3 tools/verify_bundle.py safe-qa
          (cd safe-qa && zip -q -r ../MAIZOWII-QA-SAFE.zip .)
          if unzip -Z1 MAIZOWII-QA-SAFE.zip | grep -iE '\\.wad$'; then
            echo "WAD unexpectedly present"; exit 1
          fi
          sha256sum MAIZOWII-QA-SAFE.zip > MAIZOWII-QA-SAFE.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: MAIZOWII-QA-SAFE-NO-WAD
          path: |
            MAIZOWII-QA-SAFE.zip
            MAIZOWII-QA-SAFE.sha256
          retention-days: 14

  release-rc:
    # Publish a PRE-RELEASE only after the source, compiler and bundle gates.
    # Physical Wii tests remain open; NEVER label this build stable v1.0.0.
    needs: [frontend, adapted, launch-contracts, installer-hid, all-in-one]
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.frontend.result == 'success' &&
      needs.adapted.result == 'success' &&
      needs.launch-contracts.result == 'success' &&
      needs.all-in-one.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MAIZOWII-PREVIEW-USB-SD
          path: preview/
      - name: Verify final branch and avoid rewriting an existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          test "$head" = "$GITHUB_SHA" || { echo "main moved; refusing stale tag"; exit 1; }
          if git ls-remote --exit-code --tags origin "refs/tags/v1.0.0-rc.1"; then
            echo "RC tag already exists; not rewriting it"
            exit 1
          fi
      - name: Exclude NAND WAD until a real Wii installation is validated
        run: |
          set -euo pipefail
          mkdir -p public
          unzip -q preview/MAIZOWII-ALL-IN-ONE.zip -d public
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path("public")
          mfile=root/"maizo/MODULE_MANIFEST.json"
          manifest=json.loads(mfile.read_text(encoding="utf-8"))
          assert manifest["installer"]["channel_wad_included"] is True
          channel=manifest.pop("channel",None)
          assert channel and channel.get("real_wii_verified") is False
          target=root/channel["path"]
          assert target.is_file() and target.suffix.lower()==".wad"
          target.unlink()
          manifest["installer"]["channel_wad_included"]=False
          (root/"wad/SHA256SUMS").unlink(missing_ok=True)
          (root/"maizo/LEIA-PRIMEIRO.txt").write_text(
              "Copie o conteudo do ZIP para a raiz FAT32 do SD/USB.\n"
              "Teste apps/maizo/boot.dol pelo Homebrew Channel.\n"
              "Este RC nao inclui WAD instalavel: instalacao NAND NAO validada.\n"
              "HID, WiiMC e autoboot ainda precisam de testes no Wii real.\n",
              encoding="utf-8")
          (root/"wad/LEIA-ANTES-DE-INSTALAR.txt").write_text(
              "WAD omitido deste release candidate por falta de teste no Wii real.\n"
              "NAO instale canais experimentais na NAND.\n",
              encoding="utf-8")
          mfile.write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY
          python3 tools/verify_bundle.py public
          (cd public && zip -q -r ../MAIZOWII-ULTIMATE-v1.0.0-rc.1.zip .)
          if unzip -Z1 MAIZOWII-ULTIMATE-v1.0.0-rc.1.zip | grep -iE '\.wad$'; then
            echo "Unsafe WAD unexpectedly present in release"; exit 1
          fi
          sha256sum MAIZOWII-ULTIMATE-v1.0.0-rc.1.zip > MAIZOWII-ULTIMATE-v1.0.0-rc.1.sha256
      - name: Publish honest pre-release with exact tested SHA
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create v1.0.0-rc.1 \
            MAIZOWII-ULTIMATE-v1.0.0-rc.1.zip \
            MAIZOWII-ULTIMATE-v1.0.0-rc.1.sha256 \
            --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "MAIZOWII ULTIMATE v1.0.0-rc.1 (testes no Wii pendentes)" \
            --notes-file docs/RELEASE_1_0_RC1.md

name: MaizoWii - validar WAD padrao MIZN
on:
  workflow_dispatch:
  push:
    paths:
      - 'channel/standard/Maizo-Frontend-MIZN-SD-USB.wad'
      - 'tools/inspect_forwarder_wad.py'
      - '.github/workflows/forwarder-wad.yml'

permissions:
  contents: read
jobs:
  validate-standard-channel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject experimental replacement channels
        run: |
          set -euo pipefail
          if test -f channel/standard/Maizo-Frontend-MIZN-SD-USB.wad; then
            python3 tools/inspect_forwarder_wad.py channel/standard/Maizo-Frontend-MIZN-SD-USB.wad
            sha256sum channel/standard/Maizo-Frontend-MIZN-SD-USB.wad
          else
            echo "MIZN WAD not committed; no channel artifacts generated"
          fi
